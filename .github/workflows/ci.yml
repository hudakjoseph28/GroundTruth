name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Escrow (Anchor) tests are intentionally not run here: `anchor test` needs the
# Solana CLI, Anchor CLI, and a Rust toolchain plus a local validator. Run
# `pnpm escrow:test` locally until a Solana toolchain job is added.
#
# No secrets are used. Tests make no network calls; the only network access is
# installing packages and pulling the Postgres image.

jobs:
  checks:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Version comes from "packageManager" in package.json (pnpm@12.18.0).
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Other packages import @groundtruth/shared from its dist/ output, which
      # is not committed, so build it before any typecheck.
      - run: pnpm --filter shared build
      - run: pnpm --filter shared typecheck
      - run: pnpm -r typecheck
      - run: pnpm lint
      - run: pnpm --filter @groundtruth/backend test
      - run: pnpm --filter @groundtruth/web test
      - run: pnpm --filter @groundtruth/web build

  backend-db:
    name: Backend DB tests (Postgres 16)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: groundtruth
          POSTGRES_PASSWORD: groundtruth
          POSTGRES_DB: groundtruth
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U groundtruth -d groundtruth"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Disposable CI database; not a secret.
      DATABASE_URL: postgresql://groundtruth:groundtruth@localhost:5432/groundtruth
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The seed imports @groundtruth/shared (dist/) and the generated Prisma client.
      - run: pnpm --filter shared build
      - run: pnpm --filter @groundtruth/backend exec prisma generate

      - run: pnpm --filter @groundtruth/backend db:migrate
      - run: pnpm --filter @groundtruth/backend db:seed
      - run: pnpm --filter @groundtruth/backend test:db
